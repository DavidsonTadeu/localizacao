<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Controle e Histórico</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; }
    
    #sidebar {
      width: 360px;
      background: #ffffff;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      z-index: 1000;
      overflow-y: auto;
    }
    
    .sidebar-header {
      padding: 16px;
      background: #4f46e5;
      color: white;
    }
    .sidebar-header h2 { margin: 0; font-size: 18px; }
    .sidebar-header p { margin: 4px 0 0; font-size: 12px; opacity: 0.8; }

    .config-box {
      padding: 16px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }
    .config-box h3 {
      margin: 0 0 12px;
      font-size: 14px;
      color: #1e293b;
    }
    .field {
      margin-bottom: 10px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .field input {
      width: 100%;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
    }
    .field input:focus {
      border-color: #4f46e5;
    }
    .btn-salvar {
      width: 100%;
      padding: 10px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-salvar:hover { background: #4338ca; }
    #statusConfig {
      font-size: 12px;
      margin-top: 6px;
      text-align: center;
      min-height: 16px;
      color: #059669;
      font-weight: 500;
    }

    .historico-section {
      padding: 16px;
      flex: 1;
    }
    .historico-section h3 {
      margin: 0 0 10px;
      font-size: 14px;
      color: #1e293b;
    }

    .item-historico {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .item-historico:hover {
      background: #eef2ff;
      border-color: #6366f1;
    }

    .item-historico.active {
      background: #e0e7ff;
      border-color: #4f46e5;
    }

    .item-data { font-weight: bold; font-size: 14px; color: #111827; }
    .item-hora { font-size: 13px; color: #4f46e5; font-weight: 600; margin-top: 2px; }
    .item-coords { font-size: 11px; color: #6b7280; margin-top: 4px; }

    #map { flex: 1; height: 100vh; }

    @media (max-width: 600px) {
      body { flex-direction: column-reverse; }
      #sidebar { width: 100%; height: 50vh; }
      #map { height: 50vh; }
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="sidebar-header">
      <h2>Painel de Controle</h2>
      <p id="total-registros">Carregando...</p>
    </div>

    <!-- Controle de dados do PIX -->
    <div class="config-box">
      <h3>✏️ Editar Informações da Tela</h3>
      
      <div class="field">
        <label>Nome</label>
        <input type="text" id="inputNome" placeholder="Ex: Maria Oliveira">
      </div>

      <div class="field">
        <label>Chave PIX</label>
        <input type="text" id="inputChave" placeholder="Ex: maria@email.com">
      </div>

      <div class="field">
        <label>Valor</label>
        <input type="text" id="inputValor" placeholder="Ex: R$ 150,00">
      </div>

      <button class="btn-salvar" id="btnSalvarConfig">Atualizar Tela Instantaneamente</button>
      <div id="statusConfig"></div>
    </div>

    <!-- Histórico de localizações -->
    <div class="historico-section">
      <h3>📜 Histórico de Localizações</h3>
      <div id="lista-historico">
        <p style="text-align: center; color: #6b7280; margin-top: 20px;">Aguardando envios...</p>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCWmb-8mTJcIJNWyisaS1qfeSDs1irw9IU",
      authDomain: "localizacao-2fa1a.firebaseapp.com",
      databaseURL: "https://localizacao-2fa1a-default-rtdb.firebaseio.com",
      projectId: "localizacao-2fa1a",
      storageBucket: "localizacao-2fa1a.firebasestorage.app",
      messagingSenderId: "1056273872739",
      appId: "1:1056273872739:web:65f045fafcdec22b3ac556",
      measurementId: "G-8N2KJP40KF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const inputNome = document.getElementById('inputNome');
    const inputChave = document.getElementById('inputChave');
    const inputValor = document.getElementById('inputValor');
    const btnSalvarConfig = document.getElementById('btnSalvarConfig');
    const statusConfig = document.getElementById('statusConfig');

    // Carrega dados configurados atualmente
    onValue(ref(db, 'config/pix'), (snapshot) => {
      const data = snapshot.val();
      if (data) {
        if (document.activeElement !== inputNome) inputNome.value = data.nome || '';
        if (document.activeElement !== inputChave) inputChave.value = data.chave || '';
        if (document.activeElement !== inputValor) inputValor.value = data.valor || '';
      }
    });

    // Salva novas configurações no Firebase
    btnSalvarConfig.addEventListener('click', () => {
      set(ref(db, 'config/pix'), {
        nome: inputNome.value,
        chave: inputChave.value,
        valor: inputValor.value
      }).then(() => {
        statusConfig.innerText = '✅ Atualizado com sucesso!';
        setTimeout(() => statusConfig.innerText = '', 3000);
      }).catch((err) => {
        statusConfig.innerText = '❌ Erro: ' + err.message;
      });
    });

    // Inicializa Mapa
    const map = L.map('map').setView([-14.235, -51.925], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let marcadores = [];
    const listaContainer = document.getElementById('lista-historico');
    const totalText = document.getElementById('total-registros');

    // Escuta alterações de histórico
    onValue(ref(db, 'localizacao/historico'), (snapshot) => {
      const data = snapshot.val();
      listaContainer.innerHTML = '';

      if (!data) {
        totalText.innerText = '0 registros encontrados';
        listaContainer.innerHTML = '<p style="text-align: center; color: #6b7280; margin-top: 20px;">Nenhuma localização enviada ainda.</p>';
        return;
      }

      const registros = Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse();
      totalText.innerText = `${registros.length} registro(s) salvo(s)`;

      marcadores.forEach(m => map.removeLayer(m));
      marcadores = [];

      registros.forEach((item, index) => {
        const dataObj = new Date(item.timestamp);
        const dataFormatada = dataObj.toLocaleDateString('pt-BR');
        const horaFormatada = dataObj.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        const m = L.marker([item.lat, item.lng]).addTo(map)
          .bindPopup(`<b>${dataFormatada} às ${horaFormatada}</b>`);
        marcadores.push(m);

        const card = document.createElement('div');
        card.className = `item-historico ${index === 0 ? 'active' : ''}`;
        card.innerHTML = `
          <div class="item-data">📅 ${dataFormatada}</div>
          <div class="item-hora">🕒 ${horaFormatada}</div>
          <div class="item-coords">📍 Lat: ${item.lat.toFixed(5)}, Lng: ${item.lng.toFixed(5)}</div>
        `;

        card.addEventListener('click', () => {
          document.querySelectorAll('.item-historico').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          map.setView([item.lat, item.lng], 16);
          m.openPopup();
        });

        listaContainer.appendChild(card);

        if (index === 0) {
          map.setView([item.lat, item.lng], 16);
          m.openPopup();
        }
      });
    });
  </script>
</body>
</html>
